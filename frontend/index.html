<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>生图工作台</title>
    <script>
      /* 首屏绘制前应用配色板：localStorage.theme 存配色 key（与 src/theme.js PALETTES 一致），
       * 默认炭黑；深色族需同时挂 html.dark（EP dark 变量跟随）（防闪白/闪错色） */
      (function () {
        var darkKeys = { dark: 1, bauhaus: 1, sweetpink: 1, taro: 1 }
        var lightKeys = { light: 1, klein: 1, cream: 1, apple: 1, mars: 1 }
        var t = localStorage.getItem('theme')
        if (!darkKeys[t] && !lightKeys[t]) t = 'dark'
        var el = document.documentElement
        el.setAttribute('data-theme', t)
        el.classList.toggle('dark', !!darkKeys[t])
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
